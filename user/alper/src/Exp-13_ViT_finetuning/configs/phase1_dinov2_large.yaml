# Phase 1: Head-only training for ViT-Large DINOv2 (reg4) -- backbone frozen
# Mirrors PlantNet reference ViT-B recipe: adam, lr=0.01, wd=0, no warmup
model: vit_large_patch14_reg4_dinov2.lvd142m
pretrained: true
num_classes: 7806
class_map: /storage/home/hcoda1/2/aerten3/ps-clef2026_plantclef-0/data/raw/class_id_to_species_mapping/class_mapping.txt
freeze_backbone: true
freeze_backbone_prefix: head

# Input (native DINOv2 ViT-L patch14 resolution; 37x37 patches + 1 CLS + 4 reg = 1374 tokens)
input_size:
  - 3
  - 518
  - 518

# Training (reference recipe: adam + no weight decay + no warmup)
epochs: 100
batch_size: 96
opt: adam
lr: 0.01
weight_decay: 0.0
sched: cosine
warmup_lr: 1.0e-5
warmup_epochs: 0
min_lr: 0

# Regularization
smoothing: 0.1
drop: 0.0
drop_path: 0.05
aa: rand-m9-mstd0.5-inc1
mixup: 0.8
cutmix: 1.0

# Precision & performance
amp: true
amp_dtype: float16
channels_last: false  # ViT doesn't benefit from NHWC (no conv blocks); matches PlantNet reference

# EMA
model_ema: true
model_ema_decay: 0.9998

# Data loading
workers: 8
pin_mem: true

# Output & logging
checkpoint_hist: 1
log_interval: 10
eval_metric: top1
patience_epochs: 10

# Reproducibility
seed: 42
