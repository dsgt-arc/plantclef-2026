# Phase 1: Head-only training for ConvNeXt-Tiny (backbone frozen)
model: convnext_tiny.dinov3_lvd1689m
pretrained: true
num_classes: 7806
freeze_backbone: true

# Input
input_size:
  - 3
  - 224
  - 224

# Training
epochs: 5
batch_size: 512
opt: adamw
lr: 1.0e-3
weight_decay: 0.0
sched: cosine
warmup_lr: 1.0e-5
warmup_epochs: 1
min_lr: 0

# Regularization (light for Phase 1)
smoothing: 0.1
drop: 0.0
drop_path: 0.0
mixup: 0.0
cutmix: 0.0

# Precision & performance
amp: true
amp_dtype: float16
channels_last: true

# EMA
model_ema: true
model_ema_decay: 0.9998

# Data loading
workers: 8
pin_mem: true

# Output & logging
checkpoint_hist: 3
log_interval: 100
eval_metric: top1

# Reproducibility
seed: 42
