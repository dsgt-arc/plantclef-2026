# Exp-10C — ConvNeXt-Large cooldown extension on train+val+test combined data.
# Initialize from Phase 2's best EMA checkpoint and run 10 epochs at low LR.
# Cooldown only — no warmup, low constant-decay LR. Mixup/CutMix kept on.
# Validation metrics will be optimistically biased (val ⊂ train_full);
# use training loss as the real signal and `last.pth.tar` as the production
# checkpoint after the run completes.
model: convnext_large.dinov3_lvd1689m
num_classes: 7806
class_map: /storage/home/hcoda1/2/aerten3/ps-clef2026_plantclef-0/data/raw/class_id_to_species_mapping/class_mapping.txt

input_size:
  - 3
  - 518
  - 518

# Cooldown training: 20 epochs, low LR, no warmup.
# Using 20 (vs Exp-13's 10) for more time under cosine decay — gentler than
# pushing LR higher, but still squeezes more learning from the val/test data.
epochs: 20
batch_size: 64
opt: adamw
lr: 2.0e-5
weight_decay: 0.05
layer_decay: 0.85
sched: cosine
warmup_epochs: 0
min_lr: 1.0e-7

# Regularization (unchanged from Phase 2)
smoothing: 0.1
drop: 0.0
drop_path: 0.3
aa: rand-m9-mstd0.5-inc1
mixup: 0.8
cutmix: 1.0

# Precision & performance
amp: true
amp_dtype: float16
channels_last: true

# EMA
model_ema: true
model_ema_decay: 0.9998

# Data loading
workers: 8
pin_mem: true

# Output & logging
checkpoint_hist: 5
recovery_interval: 500
log_interval: 100
eval_metric: top1
patience_epochs: 999  # disable early stopping during cooldown

seed: 42
