[project]
name = "001-sam3-pcs"
version = "0.1.0"
description = "Promptable Concept Segmentation using SAM3 for PlantCLEF 2026"
authors = [
    { name = "Adrian Cheung", email = "acheung46@gatech.edu" },
]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.7.0",
    "torchvision",
    "transformers>=4.40.0",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
    "huggingface_hub>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "ipython>=8.0.0",
    "jupyter>=1.0.0",
    "matplotlib>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

