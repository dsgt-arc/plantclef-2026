[project]
name = "001-dinov2-grid-ablation"
version = "0.1.0"
description = "Grid-size ablation study for fine-tuned DINOv2 on PlantCLEF 2026"
authors = [
    { name = "Murilo Gustineli", email = "mgustineli3@gatech.edu" },
]
requires-python = ">=3.10"
dependencies = [
    "timm>=1.0.0",
    "pillow>=10.0.0",
    "pandas>=2.0.0",
    "tqdm>=4.65.0",
    "matplotlib>=3.7.0",
    "nvidia-ml-py>=12.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plantclef"]
