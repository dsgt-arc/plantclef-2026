[project]
name = "003-tileq-decoder"
version = "0.1.0"
description = "TileQ-Decoder: label-as-query multi-label decoder over per-tile DINOv2 CLS embeddings, trained on synthetic CLS-domain pseudo-quadrats (PlantCLEF 2026)"
authors = [
    { name = "Murilo Gustineli", email = "mgustineli3@gatech.edu" },
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "timm>=1.0.0",
    "faiss-cpu>=1.7.0",
    "pillow>=10.0.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "nvidia-ml-py>=12.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plantclef"]
