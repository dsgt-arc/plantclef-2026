[project]
name = "murilo-scripts"
version = "0.1.0"
description = "Utility scripts for PlantCLEF 2026 (download data, etc.)"
authors = [
    { name = "Murilo Gustineli", email = "mgustineli3@gatech.edu" },
]
requires-python = ">=3.10"
dependencies = [
    "aria2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["download_data.py"]
