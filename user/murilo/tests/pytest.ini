[pytest]
# Run from user/murilo/ with: pytest tests/
testpaths = .
python_files = test_*.py
python_functions = test_*
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    data: marks tests that read shared data parquets (skip with '-m "not data"')
addopts = -v --tb=short --color=yes

# Test organization:
# tests/
# ├── 003-tileq-decoder/   (experiment 003 tests)
# └── common/              (shared fixtures, optional)
