[project]
name = "plantclef"
version = "0.1.0"
description = "PlantCLEF 2026 — multi-label vegetation-plot species identification"
authors = [
    {name = "Murilo Gustineli", email = "mgustineli3@gatech.edu"}
]
requires-python = ">=3.10"
dependencies = [
    # Core ML/DL
    "torch>=2.1.0",
    "timm>=1.0.0",
    "numpy>=1.24.0",

    # Retrieval
    "faiss-cpu>=1.7.0",

    # Image processing
    "pillow>=10.0.0",

    # Data handling
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",

    # Kaggle
    "kaggle>=1.6.0",

    # Utilities
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "nvidia-ml-py>=12.0.0",

    # Visualization
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "ipython>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plantclef"]
